<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Archiv Hub{% endblock %}</title>
  <meta name="theme-color" content="#0B345C">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='archiv.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if session.get('authenticated') %}
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('index') }}" title="Startseite">
        <img src="{{ url_for('static', filename='archive-hub-logo.png') }}" alt="Archiv Hub">
      </a>
      {# Schrittleiste mittig zwischen Logo und Einstellungen. #}
      {% block schrittleiste %}{% endblock %}
      <nav class="main-nav" id="main-nav">
        <a class="icon-link" href="/einstellungen/ziele" title="Ablageorte verwalten"
           aria-label="Ablageorte verwalten">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>
        <button type="button" class="btn btn-logout" onclick="archivLogout()">Abmelden</button>
      </nav>
    </div>
  </header>
  {% endif %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">Archiv Hub · Version {{ app_version }}</div>
  </footer>

  <script>window.ARCHIV_HUB_CSRF = "{{ csrf_token }}";</script>
  <script src="{{ url_for('static', filename='archiv.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
